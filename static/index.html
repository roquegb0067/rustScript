<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aprendendo JSON + Rust</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #121212; color: #fff; }
    form { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin-bottom: 20px; }
    input, button { padding: 8px; border-radius: 4px; border: 1px solid #444; }
    button { background: #007acc; color: white; cursor: pointer; border: none; }
    
    /* Grid de Cards */
    #container-cards { display: flex; flex-wrap: wrap; gap: 15px; }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-left: 4px solid #007acc;
      padding: 15px;
      border-radius: 6px;
      width: 220px;
    }
  </style>
</head>
<body>

  <h2>Cadastro de Usuário</h2>
  <form id="formUsuario">
    <input type="text" id="nome" placeholder="Nome" required />
    <input type="number" id="idade" placeholder="Idade" required />
    <input type="text" id="profissao" placeholder="Profissão/Outro" required />
    <button type="submit">Enviar para o Rust</button>
  </form>

  <h2>Cards Criados (Array JS)</h2>
  <div id="container-cards"></div>

  <script src="script.js"></script>
</body>
</html>
